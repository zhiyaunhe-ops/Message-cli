<!DOCTYPE html>
<html lang="zh-CN" data-theme="ink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信箱 · Mail WebUI</title>
<link rel="icon" type="image/png" href="/static/icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✉</span>
      <div>
        <h1>信箱</h1>
        <p class="account" id="account">加载中…</p>
      </div>
    </div>

    <div class="seg app-seg" id="appSeg" title="切换信箱 / 微信统计">
      <button data-app="mail" class="active">✉ 信箱</button>
      <button data-app="wechat">💬 微信</button>
    </div>

    <div class="search-wrap">
      <input class="input" id="search" type="search" placeholder="搜索主题 / 发件人 / 正文…（按 / 聚焦）" autocomplete="off">
      <select class="select" id="range">
        <option value="2026-07-01">7 月以来</option>
        <option value="d30">最近 30 天</option>
        <option value="d7">最近 7 天</option>
        <option value="all">全部时间</option>
      </select>
    </div>

    <div class="actions">
      <button class="btn" id="composeBtn" title="写一封新邮件">✏ 写邮件</button>
      <button class="btn" id="unreadBtn" title="只看未读">未读</button>
      <button class="btn btn-primary" id="syncBtn">同步</button>
      <button class="btn" id="settingsBtn" title="设置 · AI 接口配置">⚙</button>
      <div class="theme-picker">
        <button class="btn" id="themeBtn"><span class="btn-label">主题 · </span><span id="themeName">宣纸水墨</span><span class="caret"> ▾</span></button>
        <div class="theme-menu" id="themeMenu"></div>
      </div>
    </div>
  </header>

  <main class="layout" id="mailView">
    <aside class="sidebar">
      <div class="side-title">目录</div>
      <ul id="folders"></ul>
      <div class="side-stats" id="stats"></div>
    </aside>

    <section class="list-pane">
      <div class="list-head">
        <div class="seg view-seg" id="viewSeg">
          <button data-view="message" class="active" title="普通邮件列表">邮件</button>
          <button data-view="thread" title="按来回复分组，聊天式阅读">会话</button>
        </div>
        <select class="select cat-select" id="category" title="按分类筛选">
          <option value="all">全部分类</option>
          <option value="personal">只看人工</option>
          <option value="boring">只看无聊</option>
          <option value="meeting">📅 会议/日程</option>
          <option value="automated">🤖 系统自动</option>
          <option value="promotion">📢 营销推广</option>
        </select>
        <span class="list-head-title" id="listTitle">收件箱</span>
        <span class="list-head-count" id="listCount"></span>
      </div>
      <div class="list" id="messageList"><div class="empty">加载中…</div></div>
      <div class="list-foot"><button class="btn" id="moreBtn">加载更多</button></div>
    </section>

    <section class="reader" id="reader">
      <div class="empty">选择一封邮件开始阅读</div>
    </section>
  </main>

  <main class="wx" id="wxView" hidden>
    <div class="wx-head">
      <h2>微信统计</h2>
      <select class="select" id="wxRange">
        <option value="7" selected>最近 7 天</option>
        <option value="30">最近 30 天</option>
        <option value="90">最近 90 天</option>
        <option value="0">全部时间</option>
      </select>
      <button class="btn" id="wxOfficial" title="过滤公众号与系统通知（微信团队 / 文件传输助手 / 订阅号入口）">隐藏公众号</button>
      <button class="btn" id="wxRefresh" title="忽略缓存重新扫描">刷新</button>
      <span class="wx-meta" id="wxMeta"></span>
    </div>
    <div class="wx-cats" id="wxCats" hidden></div>
    <div class="wx-body" id="wxBody"><div class="empty">加载中…</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="modal-mask" id="composeModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="composeTitle">写邮件</h3>
      <button class="modal-close" id="composeClose" title="关闭">×</button>
    </div>
    <form id="composeForm">
      <div class="chip-field" id="cToField">
        <div class="chips" id="cToChips"></div>
        <input class="chip-input" id="cTo" type="text" autocomplete="off" spellcheck="false"
               placeholder="收件人（输入姓名或邮箱，回车 / 逗号确认）">
        <div class="chip-menu" id="cToMenu" hidden></div>
      </div>
      <div class="chip-field" id="cCcField">
        <div class="chips" id="cCcChips"></div>
        <input class="chip-input" id="cCc" type="text" autocomplete="off" spellcheck="false"
               placeholder="抄送（可选）">
        <div class="chip-menu" id="cCcMenu" hidden></div>
      </div>
      <input class="input" id="cSubject" placeholder="主题" autocomplete="off">
      <textarea class="input" id="cBody" rows="11" placeholder="正文…"></textarea>
      <div class="ai-opts" id="aiOpts" hidden></div>
      <div class="file-list" id="cFileList" hidden></div>
      <div class="compose-row">
        <label class="file-btn" id="cFileBtn">📎 添加附件<input id="cFiles" type="file" multiple hidden></label>
        <button type="button" class="btn btn-ai" id="aiBtn"
                title="读取与收件人的最近往来邮件 + 当前标题正文，让 AI 给出 3 个场景的正文与主题">✨ AI 写正文</button>
        <button type="button" class="btn btn-ai" id="aiToggle" hidden
                title="重新展开上一次 AI 给出的方案">✨ AI 建议</button>
        <span class="file-names" id="cFileNames"></span>
      </div>
      <div class="modal-foot">
        <span class="compose-status" id="composeStatus"></span>
        <span class="draft-status" id="draftStatus"></span>
        <button type="button" class="btn" id="composeCancel">取消</button>
        <button type="submit" class="btn btn-primary" id="sendBtn">发送 ➤</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-mask" id="settingsModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>设置 · AI 接口</h3>
      <button class="modal-close" id="settingsClose" title="关闭">×</button>
    </div>
    <form id="settingsForm">
      <p class="settings-hint">
        共同配置存放于 <code>config/app.toml</code>（已 gitignore，不会入库），改完立即生效。<br>
        任何 OpenAI 兼容接口都能用：OpenAI / DeepSeek / 通义 / Kimi / 本地 Ollama 的 <code>/v1</code>。
      </p>
      <label class="field"><span>接口地址 base_url</span>
        <input class="input" id="cfgBaseUrl" placeholder="https://api.openai.com/v1" autocomplete="off"></label>
      <label class="field"><span>API Key</span>
        <input class="input" id="cfgApiKey" type="password" placeholder="留空表示不修改已保存的密钥" autocomplete="new-password"></label>
      <label class="field"><span>模型 model</span>
        <input class="input" id="cfgModel" placeholder="gpt-4o-mini" autocomplete="off"></label>
      <div class="field-grid">
        <label class="field"><span>温度</span>
          <input class="input" id="cfgTemp" type="number" step="0.1" min="0" max="2"></label>
        <label class="field"><span>超时（秒）</span>
          <input class="input" id="cfgTimeout" type="number" min="5" max="300"></label>
        <label class="field"><span>参考邮件数</span>
          <input class="input" id="cfgRecent" type="number" min="1" max="30"></label>
        <label class="field"><span>单封截断（字）</span>
          <input class="input" id="cfgCtxChars" type="number" min="200" max="6000"></label>
      </div>
      <label class="switch"><input type="checkbox" id="cfgEnabled"><span>启用 AI 写正文</span></label>
      <div class="settings-meta" id="settingsMeta"></div>
      <div class="modal-foot">
        <span class="compose-status" id="settingsStatus"></span>
        <button type="button" class="btn" id="cfgTest" title="先保存当前填写的内容，再发一条最小请求验证连通性">测试连接</button>
        <button type="button" class="btn" id="settingsCancel">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
